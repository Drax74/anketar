<div class="controls-row">
    <span style="font-size: 1rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant);">{{t:legacy.stays}}<span id="options-count">0</span>)</span>
    <div style="display: flex; gap: 8px;">
        <button id="btn-manual-sort" class="btn btn-secondary" style="width: auto; padding: 8px 12px; font-size: 0.85rem;" onclick="toggleManualSort()" title="{{t:legacy.sortTitle}}">
            <span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle;">&#xe8d5;</span> {{t:stays.sort}}
        </button>
        <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" onclick="openAddModal()">{{t:legacy.add}}</button>
    </div>
</div>
