<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Group Travel Poll</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --md-sys-color-background: #121316;
      --md-sys-color-surface: #1e1f24;
      --md-sys-color-surface-container: #28292e;
      --md-sys-color-surface-container-high: #33343a;
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-on-primary: #062e6f;
      --md-sys-color-primary-container: #1d3a70;
      --md-sys-color-on-primary-container: #d3e3fd;
      --md-sys-color-outline: #8e9099;
      --md-sys-color-outline-variant: #44474f;
      --md-sys-color-on-surface: #e3e3e8;
      --md-sys-color-on-surface-variant: #c4c6d0;
      --md-sys-color-success: #6dd58c;
      
      --md-shape-corner-extra-large: 28px;
      --md-shape-corner-large: 20px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-small: 8px;
      
      --md-elevation-1: 0 1px 3px 1px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      
      --transition-standard: 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

    body { background-color: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); min-height: 100vh; display: flex; justify-content: center; padding: 16px 12px 48px 12px; }

    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    .header-card { background: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-shape-corner-large); padding: 24px 20px; text-align: center; box-shadow: var(--md-elevation-1); }
    .header-card h1 { font-size: 1.5rem; font-weight: 600; color: var(--md-sys-color-on-surface); letter-spacing: -0.5px; }
    .header-card p { font-size: 0.875rem; color: var(--md-sys-color-on-surface-variant); margin-top: 6px; }

    .user-badge { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 6px 16px; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-radius: var(--md-shape-corner-small); font-size: 0.85rem; font-weight: 500; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity var(--transition-standard); }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: var(--md-sys-color-surface-container); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-shape-corner-extra-large); padding: 28px 24px; width: 100%; max-width: 400px; box-shadow: var(--md-elevation-2); }
    .modal h2 { font-size: 1.35rem; font-weight: 600; margin-bottom: 8px; color: var(--md-sys-color-on-surface); }

    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 0.8rem; color: var(--md-sys-color-on-surface-variant); font-weight: 500; }

    .input-field { width: 100%; padding: 14px 16px; background: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-shape-corner-medium); color: var(--md-sys-color-on-surface); font-size: 1rem; outline: none; transition: border-color var(--transition-standard); }
    .input-field:focus { border-color: var(--md-sys-color-primary); border-width: 2px; padding: 13px 15px; }

    .btn { width: 100%; padding: 14px 20px; border: none; border-radius: var(--md-shape-corner-medium); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition-standard); }
    .btn-primary { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); border: 1px solid var(--md-sys-color-outline-variant); }

    .options-list { display: flex; flex-direction: column; gap: 16px; }
    .option-card { background: var(--md-sys-color-surface); border: 2px solid var(--md-sys-color-outline-variant); border-radius: var(--md-shape-corner-large); overflow: hidden; transition: var(--transition-standard); cursor: pointer; box-shadow: var(--md-elevation-1); }
    .option-card.selected { border-color: var(--md-sys-color-primary); background: var(--md-sys-color-surface-container); }

    .card-cover-container { width: 100%; height: 160px; position: relative; background: var(--md-sys-color-surface-container-high); overflow: hidden; }
    .card-cover { width: 100%; height: 100%; object-fit: cover; }
    .price-badge { position: absolute; top: 12px; right: 12px; background: rgba(18, 19, 22, 0.85); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: var(--md-shape-corner-small); font-size: 0.85rem; font-weight: 600; color: var(--md-sys-color-success); }

    .card-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .card-header-row { display: flex; align-items: center; gap: 12px; }
    .checkbox-custom { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--md-sys-color-outline); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: var(--transition-standard); }
    .option-card.selected .checkbox-custom { background: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); }
    .option-card.selected .checkbox-custom::after { content: '✓'; color: var(--md-sys-color-on-primary); font-weight: bold; font-size: 0.85rem; }

    .card-title { font-size: 1.05rem; font-weight: 600; color: var(--md-sys-color-on-surface); text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .card-title:hover { color: var(--md-sys-color-primary); }

    .progress-bar-bg { width: 100%; height: 8px; background: var(--md-sys-color-surface-container-high); border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--md-sys-color-primary); width: 0%; transition: width 0.4s ease-out; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--md-sys-color-on-surface-variant); font-weight: 500; }
    .voters-container { font-size: 0.75rem; color: var(--md-sys-color-outline); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .voter-tag { background: var(--md-sys-color-surface-container-high); padding: 3px 10px; border-radius: 12px; color: var(--md-sys-color-on-surface-variant); font-weight: 500; }

    .spinner { width: 32px; height: 32px; border: 3px solid var(--md-sys-color-outline-variant); border-top-color: var(--md-sys-color-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header-card">
      <h1>🏖️ Group Trip Poll</h1>
      <p>Vote for your favorite accommodation</p>
      <div id="user-info-area" style="display: none;">
        <div class="user-badge">👤 Logged in as: <strong id="display-user-name">User</strong></div>
      </div>
    </header>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px;">
      <span style="font-size: 1rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant);">Options (<span id="options-count">0</span>)</span>
      <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" onclick="openAddModal()">+ Add Option</button>
    </div>

    <div id="options-container" class="options-list">
      <div class="header-card" style="padding: 40px 20px;">
        <div class="spinner" style="margin: 0 auto 12px auto;"></div>
        <p>Loading accommodations...</p>
      </div>
    </div>
  </div>

  <!-- AUTHENTICATION MODAL -->
  <div id="auth-modal" class="modal-overlay">
    <div class="modal">
      <h2>Group Access</h2>
      <p style="font-size: 0.85rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 20px; line-height: 1.4;">
        Enter your whitelisted email address to receive your login code.
      </p>

      <div id="auth-step-1">
        <div class="form-group">
          <label for="input-email">Your Email Address</label>
          <input type="email" id="input-email" class="input-field" placeholder="name@example.com" />
        </div>
        <button class="btn btn-primary" id="btn-verify-trigger" onclick="startVerification()">Send Code to Email</button>
      </div>

      <div id="auth-step-2" style="display: none; text-align: center;">
        <p style="font-size: 0.85rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 16px; line-height: 1.4;">
          We sent a 4-digit code to your email. Check your inbox and enter it below:
        </p>
        
        <div style="margin-bottom: 16px;">
          <input type="text" id="input-code" placeholder="----" maxlength="4" class="input-field" style="text-align: center; font-size: 1.5rem; letter-spacing: 8px;">
        </div>
        
        <button class="btn btn-primary" onclick="verifyEnteredCode()">Confirm & Login</button>
      </div>
    </div>
  </div>

  <!-- ADD OPTION MODAL -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal">
      <h2>Add Accommodation</h2>
      <div class="form-group" style="margin-top: 12px;">
        <label for="input-link">Accommodation Link</label>
        <input type="url" id="input-link" class="input-field" placeholder="https://..." onblur="autoFetchMetadata()" />
      </div>
      <div class="form-group">
        <label for="input-title">Title / Name</label>
        <input type="text" id="input-title" class="input-field" placeholder="Villa Horizon" />
      </div>
      <div class="form-group">
        <label for="input-price">Total Price</label>
        <input type="text" id="input-price" class="input-field" placeholder="450€ total" />
      </div>
      <div class="form-group">
        <label for="input-image">Image URL</label>
        <input type="url" id="input-image" class="input-field" placeholder="https://..." />
      </div>
      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button class="btn btn-primary" id="btn-add-submit" onclick="submitNewOption()">Add Proposal</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL';

    let state = {
      email: localStorage.getItem('poll_user_email') || '',
      userName: localStorage.getItem('poll_user_name') || '',
      selectedOptionIds: new Set(),
      options: []
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (!state.email || !state.userName) {
        document.getElementById('auth-modal').classList.add('active');
      } else {
        updateUserUI();
        fetchPollData();
      }
    });

    function startVerification() {
      const emailInput = document.getElementById('input-email').value.trim();
      if (!emailInput) return alert('Please enter your email address.');
    
      const triggerBtn = document.getElementById('btn-verify-trigger');
      triggerBtn.innerText = 'Sending Code...';
      triggerBtn.disabled = true;
    
      fetch(`${GOOGLE_SCRIPT_URL}?action=checkWhitelist&email=${encodeURIComponent(emailInput)}`)
        .then(res => res.json())
        .then(result => {
          if (result.status === 'success') {
            state.email = emailInput;
            state.userName = result.name;

            document.getElementById('auth-step-1').style.display = 'none';
            document.getElementById('auth-step-2').style.display = 'block';
          } else {
            alert(result.message || 'Access Denied: Email not on group whitelist.');
          }
        })
        .catch(err => {
          console.error('Whitelist check error:', err);
          alert('Verification request failed. Check your network.');
        })
        .finally(() => {
          triggerBtn.innerText = 'Send Code to Email';
          triggerBtn.disabled = false;
        });
    }

    async function verifyEnteredCode() {
      const enteredCode = document.getElementById('input-code').value.trim();
      if (!enteredCode || enteredCode.length !== 4) {
        return alert('Please enter the 4-digit code.');
      }

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'verifyCode',
            email: state.email,
            code: enteredCode
          })
        });

        const result = await res.json();

        if (result.status === 'success' && result.approved === true) {
          localStorage.setItem('poll_user_email', state.email);
          localStorage.setItem('poll_user_name', state.userName);
          document.getElementById('auth-modal').classList.remove('active');
          updateUserUI();
          fetchPollData();
        } else {
          alert(result.message || 'Invalid code. Please check your inbox and try again.');
        }
      } catch (err) {
        console.error('Verification error:', err);
        alert('Network error during verification.');
      }
    }

    function updateUserUI() {
      document.getElementById('display-user-name').innerText = state.userName;
      document.getElementById('user-info-area').style.display = 'block';
    }

    async function fetchPollData() {
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getPollData`);
        const result = await res.json();
        if (result.status === 'success') {
          state.options = result.data;
          
          state.selectedOptionIds.clear();
          state.options.forEach(opt => {
            if (opt.voters && opt.voters.includes(state.userName)) {
              state.selectedOptionIds.add(opt.id);
            }
          });
          renderOptions();
        }
      } catch (err) { 
        console.error('Fetch poll data failed:', err); 
      }
    }

    function renderOptions() {
      const container = document.getElementById('options-container');
      document.getElementById('options-count').innerText = state.options.length;

      const allVoters = new Set();
      state.options.forEach(opt => opt.voters?.forEach(v => allVoters.add(v)));
      const totalVoters = allVoters.size || 1;

      const sorted = [...state.options].sort((a, b) => (b.voters?.length || 0) - (a.voters?.length || 0));

      container.innerHTML = sorted.map(opt => {
        const isSelected = state.selectedOptionIds.has(opt.id);
        const votes = opt.voters ? opt.voters.length : 0;
        const pct = Math.round((votes / totalVoters) * 100) || 0;
        const votersList = opt.voters?.length ? opt.voters.map(v => `<span class="voter-tag">${v}</span>`).join('') : '<em>No votes</em>';

        return `
          <div class="option-card ${isSelected ? 'selected' : ''}" onclick="handleCardClick('${opt.id}')">
            <div class="card-cover-container">
              <img class="card-cover" src="${opt.image}" alt="${opt.title}" loading="lazy" onError="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80'" />
              <div class="price-badge">${opt.price}</div>
            </div>
            <div class="card-body">
              <div class="card-header-row">
                <div class="checkbox-custom"></div>
                <a href="${opt.link}" target="_blank" class="card-title" onclick="event.stopPropagation()">${opt.title} ↗</a>
              </div>
              <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%;"></div></div>
              <div class="progress-info"><span>${votes} votes</span><span>${pct}%</span></div>
              <div class="voters-container"><span>Voted by:</span> ${votersList}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleCardClick(optionId) {
      const isCurrentlySelected = state.selectedOptionIds.has(optionId);
      
      if (isCurrentlySelected) {
        state.selectedOptionIds.delete(optionId);
      } else {
        state.selectedOptionIds.add(optionId);
      }

      const targetOpt = state.options.find(o => o.id === optionId);
      if (targetOpt) {
        if (!isCurrentlySelected) {
          if (!targetOpt.voters.includes(state.userName)) targetOpt.voters.push(state.userName);
        } else {
          targetOpt.voters = targetOpt.voters.filter(v => v !== state.userName);
        }
      }

      renderOptions();

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'vote',
            userName: state.userName,
            votedOptionIds: Array.from(state.selectedOptionIds)
          })
        });

        const result = await res.json();
        if (result.status !== 'success') {
          throw new Error('Server rejected vote');
        }
      } catch (err) {
        console.error('Vote sync failed:', err);
        alert('Failed to save vote. Reverting...');
        if (isCurrentlySelected) state.selectedOptionIds.add(optionId);
        else state.selectedOptionIds.delete(optionId);
        fetchPollData();
      }
    }

    async function autoFetchMetadata() {
      const url = document.getElementById('input-link').value.trim();
      if (!url) return;

      try {
        const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
        const json = await res.json();
        if (json.status === 'success' && json.data) {
          if (json.data.title && !document.getElementById('input-title').value) {
            document.getElementById('input-title').value = json.data.title;
          }
          if (json.data.image?.url && !document.getElementById('input-image').value) {
            document.getElementById('input-image').value = json.data.image.url;
          }
        }
      } catch (e) {
        console.warn('Metadata fetch skipped:', e);
      }
    }

    async function submitNewOption() {
      const title = document.getElementById('input-title').value.trim();
      const link = document.getElementById('input-link').value.trim();
      const price = document.getElementById('input-price').value.trim();
      const image = document.getElementById('input-image').value.trim();

      if (!title || !link) return alert('Title and link are required.');

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'addOption',
            id: 'opt_' + Date.now(),
            title, link, 
            price: price || 'N/A',
            image: image || 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80'
          })
        });
        closeAddModal();
        fetchPollData();
      } catch (err) { 
        alert('Failed to add proposal.'); 
      }
    }

    function openAddModal() { document.getElementById('add-modal').classList.add('active'); }
    function closeAddModal() { 
      document.getElementById('add-modal').classList.remove('active');
      document.getElementById('input-title').value = '';
      document.getElementById('input-link').value = '';
      document.getElementById('input-price').value = '';
      document.getElementById('input-image').value = '';
    }
  </script>
</body>
</html>
