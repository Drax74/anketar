name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secrets into index.html
        env:
          SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          sed -i "s|YOUR_GOOGLE_APPS_SCRIPT_URL|$SCRIPT_URL|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
